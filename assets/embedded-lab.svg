<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>MAJIE — embedded developer</title>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A1522"/>
      <stop offset="0.5" stop-color="#0D1D2E"/>
      <stop offset="1" stop-color="#0A1A16"/>
    </linearGradient>
    <pattern id="perf" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.2" fill="#1F2A37"/>
    </pattern>
    <filter id="pulseGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .ledg { animation: kg 2s infinite; }
      .leda { animation: ka 3.1s 0.6s infinite; }
      .ledchip { animation: kg 1.4s infinite; }
      @keyframes kg { 50% { opacity: 0.2; } }
      @keyframes ka { 50% { opacity: 0.15; } }
    </style>
  </defs>

  <!-- board -->
  <rect x="1" y="1" width="1198" height="318" rx="20" fill="url(#bg2)" stroke="#30363D" stroke-width="1.5"/>
  <rect x="1" y="1" width="1198" height="318" rx="20" fill="url(#perf)"/>

  <!-- ambient blobs -->
  <circle cx="1060" cy="70" r="120" fill="#22D3EE" opacity="0.07"/>
  <circle cx="140" cy="260" r="140" fill="#34D399" opacity="0.07"/>

  <!-- copper traces: base lane + core -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 682 120 H 830 L 880 60 H 1190" stroke="#123B3E" stroke-width="7"/>
    <path d="M 682 120 H 830 L 880 60 H 1190" stroke="#2DD4BF" stroke-width="1.8" opacity="0.55"/>
    <path d="M 682 190 H 760 L 810 235 H 1190" stroke="#123B3E" stroke-width="7"/>
    <path d="M 682 190 H 760 L 810 235 H 1190" stroke="#2DD4BF" stroke-width="1.8" opacity="0.55"/>
    <path d="M 40 302 H 1160" stroke="#123B3E" stroke-width="7"/>
    <path d="M 40 302 H 1160" stroke="#2DD4BF" stroke-width="1.8" opacity="0.4"/>
    <path d="M 478 155 H 430" stroke="#123B3E" stroke-width="5"/>
  </g>

  <!-- vias -->
  <circle cx="430" cy="155" r="4.5" fill="#0D1117" stroke="#D29922" stroke-width="1.5"/>
  <circle cx="540" cy="302" r="4.5" fill="#0D1117" stroke="#D29922" stroke-width="1.5"/>
  <circle cx="600" cy="302" r="4.5" fill="#0D1117" stroke="#D29922" stroke-width="1.5"/>
  <circle cx="660" cy="302" r="4.5" fill="#0D1117" stroke="#D29922" stroke-width="1.5"/>

  <!-- signal pulses -->
  <circle r="4" fill="#60A5FA" filter="url(#pulseGlow)">
    <animateMotion dur="3.4s" repeatCount="indefinite" path="M 682 120 H 830 L 880 60 H 1190"/>
  </circle>
  <circle r="4" fill="#5EEAD4" filter="url(#pulseGlow)">
    <animateMotion dur="4.2s" begin="0.8s" repeatCount="indefinite" path="M 682 190 H 760 L 810 235 H 1190"/>
  </circle>
  <circle r="4" fill="#FACC15" filter="url(#pulseGlow)">
    <animateMotion dur="5s" begin="1.6s" repeatCount="indefinite" path="M 40 302 H 1160"/>
  </circle>

  <!-- left silkscreen text -->
  <g font-family="Consolas, 'Cascadia Code', Menlo, 'Courier New', monospace">
    <text x="70" y="120" fill="#E6EDF3" font-size="46" font-weight="700" letter-spacing="3">EMBEDDED</text>
    <text x="70" y="172" fill="#5EEAD4" font-size="46" font-weight="700" letter-spacing="3">DEVELOPER</text>
    <path d="M 70 192 H 340" stroke="#30363D" stroke-width="2"/>
    <text x="70" y="222" fill="#8B949E" font-size="14">STM32 / GD32 &#183; FreeRTOS &#183; RT-Thread</text>
    <text x="70" y="246" fill="#8B949E" font-size="14">Linux bring-up &#183; CMake / Keil / J-Link</text>
    <text x="64" y="290" fill="#435965" font-size="10">rev 2.1 &#183; 2026</text>
  </g>

  <!-- MCU chip -->
  <g>
    <g fill="#1B3A4B">
      <rect x="482" y="116" width="18" height="8" rx="2"/><rect x="482" y="151" width="18" height="8" rx="2"/>
      <rect x="482" y="186" width="18" height="8" rx="2"/><rect x="482" y="221" width="18" height="8" rx="2"/>
      <rect x="660" y="116" width="18" height="8" rx="2"/><rect x="660" y="151" width="18" height="8" rx="2"/>
      <rect x="660" y="186" width="18" height="8" rx="2"/><rect x="660" y="221" width="18" height="8" rx="2"/>
      <rect x="516" y="77" width="8" height="18" rx="2"/><rect x="551" y="77" width="8" height="18" rx="2"/>
      <rect x="586" y="77" width="8" height="18" rx="2"/><rect x="621" y="77" width="8" height="18" rx="2"/>
      <rect x="516" y="245" width="8" height="18" rx="2"/><rect x="551" y="245" width="8" height="18" rx="2"/>
      <rect x="586" y="245" width="8" height="18" rx="2"/><rect x="621" y="245" width="8" height="18" rx="2"/>
    </g>
    <rect x="500" y="95" width="160" height="160" rx="10" fill="#0B1E2D" stroke="#67E8F9" stroke-width="2"/>
    <circle cx="516" cy="111" r="4" fill="#30363D"/>
    <circle cx="642" cy="110" r="4" fill="#FACC15" class="ledchip"/>
    <g font-family="Consolas, 'Courier New', monospace" text-anchor="middle">
      <text x="580" y="172" fill="#E0F2FE" font-size="26" font-weight="700" letter-spacing="2">MAJIE</text>
      <text x="580" y="196" fill="#A7F3D0" font-size="13">STM32 &#183; GD32</text>
      <text x="580" y="220" fill="#435965" font-size="10">ARM CORTEX-M</text>
    </g>
  </g>

  <!-- right status panel -->
  <g font-family="Consolas, 'Courier New', monospace">
    <text x="880" y="118" fill="#3FB950" font-size="15">&gt; MCUQuickStart v3</text>
    <text x="880" y="142" fill="#8B949E" font-size="14">families 4 &#183; chips 37</text>
    <path d="M 880 162 H 1100" stroke="#30363D" stroke-width="1.5"/>
    <text x="880" y="190" fill="#8B949E" font-size="12" letter-spacing="6">STATUS</text>
    <circle cx="890" cy="222" r="5" fill="#3FB950" class="ledg"/>
    <text x="904" y="227" fill="#8B949E" font-size="13">LINK</text>
    <circle cx="975" cy="222" r="5" fill="#FACC15" class="leda"/>
    <text x="989" y="227" fill="#8B949E" font-size="13">ACT</text>
    <circle cx="1048" cy="222" r="5" fill="#60A5FA"/>
    <text x="1062" y="227" fill="#8B949E" font-size="13">PWR</text>
    <text x="880" y="262" fill="#8B949E" font-size="13">uptime: 6+ years on GitHub</text>
  </g>
</svg>

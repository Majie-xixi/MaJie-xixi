<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 332" font-family="Consolas, 'Cascadia Code', Menlo, 'Courier New', monospace">
  <title>majie@stm32:~ whoami</title>
  <style>
    .ln { opacity: 0; animation: appear .5s ease forwards; }
    .d1{animation-delay:.05s}.d2{animation-delay:.30s}.d3{animation-delay:.50s}.d4{animation-delay:.70s}
    .d5{animation-delay:.90s}.d6{animation-delay:1.10s}.d7{animation-delay:1.30s}.d8{animation-delay:1.50s}
    .d9{animation-delay:1.70s}.d10{animation-delay:1.95s}
    @keyframes appear { to { opacity: 1; } }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <!-- window -->
  <rect x="1" y="1" width="758" height="330" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <!-- title bar -->
  <rect x="1.75" y="1.75" width="756.5" height="34" rx="8.25" fill="#161b22"/>
  <rect x="1.75" y="20" width="756.5" height="16.5" fill="#161b22"/>
  <circle cx="26" cy="19" r="6.5" fill="#ff5f56"/>
  <circle cx="48" cy="19" r="6.5" fill="#ffbd2e"/>
  <circle cx="70" cy="19" r="6.5" fill="#27c93f"/>
  <text x="390" y="24" text-anchor="middle" font-size="13" fill="#8b949e">majie@stm32: ~/firmware — 96×24</text>

  <!-- prompt -->
  <text class="ln d1" font-size="15" y="72">
    <tspan x="30" fill="#3fb950">$</tspan><tspan x="46" fill="#e6edf3">whoami</tspan>
  </text>

  <!-- boot log -->
  <text class="ln d2" font-size="15" y="98">
    <tspan x="30" fill="#8b949e">[  0.000000]</tspan><tspan x="150" fill="#58a6ff">identity:</tspan><tspan x="252" fill="#e6edf3">Majie &#183; Embedded Developer</tspan>
  </text>
  <text class="ln d3" font-size="15" y="124">
    <tspan x="30" fill="#8b949e">[  0.000125]</tspan><tspan x="150" fill="#58a6ff">firmware:</tspan><tspan x="252" fill="#e6edf3">STM32 / GD32 / ARM Cortex-M</tspan>
  </text>
  <text class="ln d4" font-size="15" y="150">
    <tspan x="30" fill="#8b949e">[  0.000251]</tspan><tspan x="150" fill="#58a6ff">system:</tspan><tspan x="252" fill="#e6edf3">Embedded Linux &#183; board bring-up</tspan>
  </text>
  <text class="ln d5" font-size="15" y="176">
    <tspan x="30" fill="#8b949e">[  0.000377]</tspan><tspan x="150" fill="#58a6ff">rtos:</tspan><tspan x="252" fill="#e6edf3">FreeRTOS &#183; RT-Thread</tspan>
  </text>
  <text class="ln d6" font-size="15" y="202">
    <tspan x="30" fill="#8b949e">[  0.000503]</tspan><tspan x="150" fill="#58a6ff">tools:</tspan><tspan x="252" fill="#e6edf3">CMake &#183; GCC &#183; Keil &#183; J-Link &#183; Python</tspan>
  </text>
  <text class="ln d7" font-size="15" y="228">
    <tspan x="30" fill="#8b949e">[  0.000629]</tspan><tspan x="150" fill="#58a6ff">uptime:</tspan><tspan x="252" fill="#e6edf3">6+ years on GitHub</tspan>
  </text>
  <text class="ln d8" font-size="15" y="254">
    <tspan x="30" fill="#8b949e">[  0.000755]</tspan><tspan x="150" fill="#58a6ff">status:</tspan><tspan x="252" fill="#3fb950">works on my board</tspan>
  </text>
  <text class="ln d9" font-size="15" y="280">
    <tspan x="30" fill="#8b949e">[  0.000881]</tspan><tspan x="150" fill="#58a6ff">faults:</tspan><tspan x="252" fill="#d29922">HardFault &#215; N, all recovered</tspan>
  </text>

  <!-- next prompt + blinking cursor -->
  <text class="ln d10" font-size="15" y="312">
    <tspan x="30" fill="#3fb950">$</tspan>
  </text>
  <rect class="cursor" x="46" y="299" width="9" height="17" fill="#3fb950"/>
</svg>
